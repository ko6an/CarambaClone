[workspace]
resolver = "2"
members = ["core", "src-tauri", "tools/rules-builder"]

[workspace.package]
version = "1.0.5"
edition = "2021"
rust-version = "1.75"
authors = ["CarambaClone contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "parking_lot"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
fst = "0.4"
zeroize = "1"
proptest = "1"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
