# Ёфикатор: пары «е»-написания → «ё»-написания, где «ё» однозначно.
# Только безопасное курируемое ядро; неоднозначные пары («все»/«всё»,
# «небо»/«нёбо», «вес»/«весть», «лет» и т.п.) сознательно исключены — D7.
# Пополняется пакетом «Правил» (M6).

[[p]]
from = "еще"
to = "ещё"

[[p]]
from = "ее"
to = "её"

[[p]]
